[build-system]
requires = ["setuptools", "wheel", "toml"]
build-backend = "setuptools.build_meta"

[project]
name = "SpiderBotAIProject"
version = "0.1.0"
requires-python = ">=3.12,<3.13"

[tool.setuptools.packages.find]
where = ["."]
include = ["SpiderBotAIProject*"]
exclude = ["config*", "docs*", "*.egg-info*"]
